[project]
name = "ycton"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "agent-client-protocol>=1.0,<2",
    "httpx>=0.28,<1",
    "mcp>=1.30,<2",
    "pywin32>=312; sys_platform == 'win32'",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
