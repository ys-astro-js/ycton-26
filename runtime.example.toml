# 이 파일을 runtime.toml로 복사하고 실제 경로·명령을 입력하세요.
# 상대 경로는 이 설정 파일의 위치 기준입니다.
# 기본 저장소는 선택입니다. 비우면 웹에서 프로젝트를 만들 때 폴더 선택 창으로 저장소를 연결합니다.
# 폴더로 연결한 프로젝트는 아래 [verify.*]를 모두 쓸 수 있습니다.
repo = "/absolute/path/to/committed-demo-repo"
# 기본 저장소의 허용 목록을 생략하면 모든 [verify.*]를 허용합니다.
# verification_profiles = ["unit"]
# default_verification_profile = "unit"
worktrees = "../../work/ycton-worktrees"
logs = "../../work/ycton-logs"
api_url = "http://127.0.0.1:8000"
timeout = 600

# 모델 제공자마다 ACP 어댑터 실행 명령과 고를 수 있는 모델, 추론 수준을 적습니다.
# 웹 UI는 이 목록에서만 고르고, 실행할 때 ACP 세션의 model·thought_level 설정으로 넘깁니다.
# 값은 어댑터가 세션 설정으로 내주는 값과 같아야 합니다. 아래 값은 claude-agent-acp 0.109.0, codex-acp 2.8.0에서 확인했습니다.
# Claude의 최신 모델(Opus 5.5 등)은 버전 ID가 아니라 별칭(opus, sonnet, fable, haiku)으로만 제공됩니다.
# 서버는 시작할 때 어댑터에 세션을 열어 별칭이 가리키는 실제 이름을 받아 화면에 보여 줍니다.
[kinds.claude]
label = "Claude"
# claude-agent-acp도 "node"와 dist/index.js 경로를 별도 인자로 넣습니다. claude CLI 로그인이 필요합니다.
command = ["node", "/absolute/path/to/claude-agent-acp/dist/index.js"]
models = ["opus", "sonnet", "fable", "haiku"]
efforts = ["low", "medium", "high", "xhigh", "max"]

[kinds.gpt]
label = "GPT"
# Codex 어댑터는 "node"와 dist/index.js 경로를 별도 인자로 넣습니다.
command = ["node", "/absolute/path/to/codex-acp/dist/index.js"]
models = ["gpt-6.2-sol", "gpt-6.2-astra", "gpt-6.1-sol"]
efforts = ["low", "medium", "high", "xhigh", "max"]

[verify.unit]
# worktree 안에서 실행됩니다. 환경을 재현할 수 있는 절대 Python 경로를 권장합니다.
command = ["/absolute/path/to/python", "-m", "pytest", "-q"]
timeout = 60
# 비우면 종료 코드 0만 요구합니다. 필요하면 성공 출력도 확인합니다.
contains = "passed"

# 필요하면 프로젝트 생성 시 선택할 수 있는 저장소를 추가하세요.
# [repositories.another]
# path = "/absolute/path/to/another-committed-repo"
# label = "다른 저장소"
# verification_profiles = ["unit"]
# default_verification_profile = "unit"
